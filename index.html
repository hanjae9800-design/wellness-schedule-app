<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 추진일정</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loading-veil" id="loadingVeil">불러오는 중…</div>

<button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="화면 모드 전환"></button>

<div id="landing" class="landing" hidden>
  <div class="landing-wrap">
    <div class="admin-head">
      <h1 class="landing-title">프로젝트 추진일정</h1>
      <a href="./admin/" class="back-link">관리자</a>
    </div>
    <p class="landing-sub">진행 중인 프로젝트를 선택하거나 새로 만드세요. 링크만 있으면 누구나 실시간으로 함께 편집할 수 있습니다.</p>
    <div class="bulk-bar" id="bulkBar" hidden>
      <span id="bulkCount"></span>
      <button type="button" class="danger" id="bulkDeleteBtn">선택 삭제</button>
      <button type="button" class="link-btn" id="bulkClearBtn">선택 해제</button>
    </div>
    <div class="project-list" id="projectList"></div>
    <div class="new-project-box">
      <h2>+ 새 프로젝트 만들기</h2>
      <div class="new-project-fields">
        <input id="newOrgInput" placeholder="상위 사업명">
        <input id="newDeptInput" placeholder="부서명">
        <input id="newPmInput" placeholder="PM(담당자)">
        <input id="newNameInput" placeholder="프로젝트명 (예: 웰니스관광)">
        <button class="primary" id="newProjectBtn">만들기</button>
      </div>
    </div>
  </div>
</div>

<div id="app" class="app" hidden>

  <button type="button" class="view-nav-toggle-btn" id="viewNavToggleBtn" title="화면 보기 전환">☰</button>
  <div class="view-nav-backdrop" id="viewNavBackdrop" hidden></div>
  <nav class="view-nav-panel" id="viewNavPanel" hidden>
    <a href="./" class="view-nav-item view-nav-home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg> 목록</a>
    <div class="view-nav-divider"></div>
    <button type="button" class="view-nav-item" data-view="all">전체업무</button>
    <button type="button" class="view-nav-item" data-view="gantt">간트차트</button>
    <button type="button" class="view-nav-item" data-view="table">업무 목록</button>
    <button type="button" class="view-nav-item" data-view="owner">담당자별 업무</button>
  </nav>


  <div class="sync-banner" id="syncBanner" hidden></div>

  <header class="page-head">
    <div class="eyebrow-fields">
      <a href="./" class="back-link">← 목록</a>
      <input id="orgInput" class="eyebrow-input" placeholder="상위 사업명">
      <span class="eyebrow-sep">/</span>
      <input id="deptInput" class="eyebrow-input" placeholder="부서명">
      <span class="eyebrow-sep">/</span>
      <input id="pmInput" class="eyebrow-input" placeholder="PM(담당자)">
      <span class="eyebrow-sep">/</span>
      <div class="team-chip-row" id="teamChipRow"></div>
      <button type="button" class="team-add-btn" id="teamAddBtn">+ 팀원 추가</button>
    </div>
    <h1 class="title">
      <input id="projNameInput" class="title-input" placeholder="프로젝트명만 입력">
      <span class="title-suffix">추진일정</span>
    </h1>
    <div class="head-actions">
      <span class="saving-dot" id="savingDot" hidden>저장 중…</span>
      <span class="proj-status-badge" id="statusBadge"></span>
      <select id="statusSelect" class="proj-status-select">
        <option value="todo">예정</option>
        <option value="doing">진행중</option>
        <option value="done">완료</option>
      </select>
      <span class="mode-badge" id="modeBadge"></span>
      <button type="button" class="secondary" id="modeToggleBtn"></button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="owner-summary-toggle-row">
    <button type="button" class="secondary" id="ownerSummaryToggleBtn">👥 담당자별 현황</button>
  </div>
  <div class="owner-summary" id="ownerSummary" hidden></div>

  <section class="board desktop-only">
    <div class="view-group" id="ganttViewGroup">
      <div class="board-toolbar">
        <div class="legend" id="legendDesktop"></div>
      </div>
      <div class="gantt-wrap" id="ganttWrap">
        <div class="gantt" id="gantt"></div>
      </div>
    </div>
    <div class="view-group" id="tableViewGroup">
    <div class="section-head">
      <h2 id="tableSectionTitle">업무 목록</h2>
    </div>
    <div class="table-scroll">
      <table class="task-table" id="taskTable">
        <colgroup>
          <col style="width:30px">
          <col data-colkey="name">
          <col style="width:76px">
          <col data-colkey="owner" style="width:120px">
          <col style="width:36px">
        </colgroup>
        <thead>
          <tr>
            <th class="col-drag"></th>
            <th class="col-name" data-colkey="name"><span class="col-resizer" data-colkey="name"></span></th>
            <th class="col-taskstatus"><select id="filterStatus" class="th-filter-select">
              <option value="">현황</option>
              <option value="todo">예정</option>
              <option value="delayed">지연</option>
              <option value="doing">진행중</option>
              <option value="done">완료</option>
            </select></th>
            <th class="col-owner" data-colkey="owner"><select id="filterOwner" class="th-filter-select"><option value="">담당자</option></select><span class="col-resizer" data-colkey="owner"></span></th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="taskTbody"></tbody>
      </table>
    </div>
    </div>
  </section>

  <section class="cards mobile-only">
    <div class="board-toolbar">
      <button class="secondary" id="timelineOpenBtn">📊 타임라인 차트 보기</button>
    </div>
    <div class="mobile-filter-row">
      <select id="filterPhaseMobile" class="th-filter-select mobile"><option value="">구분</option></select>
      <select id="filterStatusMobile" class="th-filter-select mobile">
        <option value="">현황</option>
        <option value="todo">예정</option>
        <option value="delayed">지연</option>
        <option value="doing">진행중</option>
        <option value="done">완료</option>
      </select>
      <select id="filterOwnerMobile" class="th-filter-select mobile"><option value="">담당자</option></select>
    </div>
    <div class="legend" id="legendMobile"></div>
    <div class="card-list" id="cardList"></div>
  </section>

  <div class="gantt-overlay" id="ganttOverlay" hidden>
    <div class="gantt-overlay-head">
      <span>타임라인</span>
      <button id="timelineCloseBtn">닫기 ✕</button>
    </div>
    <div class="gantt-overlay-body" id="ganttOverlayBody"></div>
  </div>

  <div class="color-picker" id="colorPicker" hidden></div>
  <div class="dep-picker-popover" id="depPicker" hidden></div>
</div>

<button id="feedbackFab" class="feedback-fab" type="button">💬 불편사항 제보</button>
<div class="feedback-modal" id="feedbackModal" hidden>
  <div class="feedback-modal-box">
    <h2>불편사항 제보</h2>
    <p class="feedback-modal-sub">버그나 불편한 점을 적어주시면 확인 후 개선하겠습니다.</p>
    <textarea id="feedbackText" rows="4" placeholder="예: 모바일에서 날짜 입력이 안 눌려요"></textarea>
    <div class="feedback-modal-actions">
      <button class="secondary" id="feedbackCancelBtn" type="button">취소</button>
      <button class="primary" id="feedbackSubmitBtn" type="button">제출</button>
    </div>
    <p class="feedback-modal-status" id="feedbackStatus" hidden></p>
  </div>
</div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
